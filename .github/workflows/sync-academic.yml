name: Sync academic metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: academic-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run safe academic discovery
        run: python scripts/sync_academic.py

      - name: Validate JSON outputs
        run: |
          python -m json.tool data/academic-identity.json >/dev/null
          python -m json.tool data/publications.json >/dev/null
          python -m json.tool data/academic-review.json >/dev/null

      - name: Commit review data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/academic-review.json
          if git diff --cached --quiet; then
            echo "No academic review changes."
          else
            git commit -m "chore: refresh academic metadata review"
            git push
          fi
